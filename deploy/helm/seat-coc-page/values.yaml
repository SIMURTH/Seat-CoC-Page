# Single replica: the store is in-memory, so replicas would not share state.
replicaCount: 1

image:
  repository: seat-coc-page
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Kubernetes ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: seat-coc.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

# OpenShift route (mutually exclusive with ingress in practice)
route:
  enabled: false
  host: ""
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# runAsUser is intentionally unset: OpenShift assigns a UID from the namespace range.
podSecurityContext:
  runAsNonRoot: true
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
